apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-search
  namespace: fortis
  labels:
    app: smart-search
    service: smart-search
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-search
  template:
    metadata:
      labels:
        app: smart-search
        service: smart-search
    spec:
      containers:
      - name: smart-search
        image: fortis/smart-search:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "smart_search"
        - name: DB_HOST
          value: "postgres-service.fortis.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: fortis-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fortis-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: fortis-secrets
              key: DB_NAME
        - name: REDIS_HOST
          value: "redis-service.fortis.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: OPENSEARCH_HOST
          value: "opensearch-service.fortis.svc.cluster.local"
        - name: OPENSEARCH_PORT
          value: "9200"
        - name: OPENSEARCH_USER
          valueFrom:
            secretKeyRef:
              name: fortis-secrets
              key: OPENSEARCH_USER
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fortis-secrets
              key: OPENSEARCH_PASSWORD
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: fortis-config
              key: LOG_LEVEL
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: fortis-config
              key: DEBUG
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always