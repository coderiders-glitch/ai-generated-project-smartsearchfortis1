apiVersion: v1
kind: ConfigMap
metadata:
  name: fortis-config
  namespace: fortis
data:
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  API_WORKERS: "4"
  REDIS_DB: "0"
  OPENSEARCH_VERIFY_CERTS: "false"
  ENABLE_SEMANTIC_SEARCH: "true"
  ENABLE_PERSONALIZATION: "true"
  ENABLE_NOTIFICATIONS: "true"
  ENABLE_CACHING: "true"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,https://*.fortis.com"
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Request-ID,X-User-ID"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "40"
  REDIS_CACHE_TTL: "3600"