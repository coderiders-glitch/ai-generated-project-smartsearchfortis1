apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fortis-ingress
  namespace: fortis
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:3000,http://localhost:8000,https://*.fortis.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Request-ID, X-User-ID"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
  - hosts:
    - api.fortis.com
    secretName: fortis-tls
  rules:
  - host: api.fortis.com
    http:
      paths:
      - path: /search
        pathType: Prefix
        backend:
          service:
            name: smart-search-service
            port:
              number: 8000
      - path: /personalize
        pathType: Prefix
        backend:
          service:
            name: personalization-service
            port:
              number: 8000
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8000
      - path: /profile
        pathType: Prefix
        backend:
          service:
            name: user-profile-service
            port:
              number: 8000