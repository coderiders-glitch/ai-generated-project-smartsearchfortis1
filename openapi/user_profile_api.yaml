openapi: 3.0.0
info:
  title: User Profile API
  description: User profile and health records management
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.fortis.com
    description: Production server
tags:
  - name: Users
    description: User profile management
  - name: Health Records
    description: User health records
  - name: Health
    description: Service health check
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: Returns service health status
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Retrieve a list of users (admin only)
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          description: Maximum number of results
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Pagination offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
                  total_count:
                    type: integer
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Users
      summary: Create user
      description: Create a new user account
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Retrieve a user profile by ID
      operationId: getUserProfile
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Users
      summary: Update user profile
      description: Update a user profile
      operationId: updateUserProfile
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete a user account
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{user_id}/health-records:
    get:
      tags:
        - Health Records
      summary: Get user health records
      description: Retrieve health records for a specific user
      operationId: getUserHealthRecords
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of results
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Pagination offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: User health records
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  health_records:
                    type: array
                    items:
                      $ref: '#/components/schemas/HealthRecord'
                  total_count:
                    type: integer
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Health Records
      summary: Create health record
      description: Create a new health record for a user
      operationId: createHealthRecord
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHealthRecordRequest'
      responses:
        '201':
          description: Health record created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{user_id}/health-records/{health_record_id}:
    get:
      tags:
        - Health Records
      summary: Get health record
      description: Retrieve a specific health record
      operationId: getHealthRecord
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
        - name: health_record_id
          in: path
          description: Health record ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Health record details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
        '404':
          description: Health record or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Health Records
      summary: Update health record
      description: Update a health record
      operationId: updateHealthRecord
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
        - name: health_record_id
          in: path
          description: Health record ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHealthRecordRequest'
      responses:
        '200':
          description: Health record updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthRecord'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Health record or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Health Records
      summary: Delete health record
      description: Delete a health record
      operationId: deleteHealthRecord
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
        - name: health_record_id
          in: path
          description: Health record ID
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Health record deleted successfully
        '404':
          description: Health record or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    UserProfile:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
            - male
            - female
            - other
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - patient
            - doctor
            - admin
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - user_id
        - username
        - email
        - first_name
        - last_name
        - role
        - is_active
        - created_at
        - updated_at
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
            - male
            - female
            - other
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - patient
            - doctor
            - admin
          default: patient
      required:
        - username
        - email
        - password
        - first_name
        - last_name
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
            - male
            - female
            - other
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        is_active:
          type: boolean
    HealthRecord:
      type: object
      properties:
        health_record_id:
          type: integer
        user_id:
          type: integer
        record_type:
          type: string
          enum:
            - diagnosis
            - prescription
            - lab_result
            - vaccination
            - allergy
            - medical_history
        title:
          type: string
        description:
          type: string
        record_date:
          type: string
          format: date
        provider_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - health_record_id
        - user_id
        - record_type
        - title
        - description
        - record_date
        - created_at
        - updated_at
    CreateHealthRecordRequest:
      type: object
      properties:
        record_type:
          type: string
          enum:
            - diagnosis
            - prescription
            - lab_result
            - vaccination
            - allergy
            - medical_history
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        record_date:
          type: string
          format: date
        provider_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - record_type
        - title
        - description
        - record_date
    UpdateHealthRecordRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        record_date:
          type: string
          format: date
        provider_name:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        error_message:
          type: string
        status_code:
          type: integer
        timestamp:
          type: string
          format: date-time
      required:
        - error
        - status_code
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []